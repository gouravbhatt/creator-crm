name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: |
          flutter create --platforms=android --org com.gouravbhatt --project-name creator_crm .
          bash tool/patch_android.sh

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: Unit tests
        run: flutter test
        continue-on-error: true

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: creator-crm-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Creator CRM build ${{ github.run_number }}
          body: Release APK built from ${{ github.sha }}. Download app-release.apk and install on Android 6.0+.
          files: build/app/outputs/flutter-apk/app-release.apk
