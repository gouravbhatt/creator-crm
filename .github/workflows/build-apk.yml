name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: |
          mkdir -p ci-logs
          flutter create --platforms=android --org com.gouravbhatt --project-name creator_crm . 2>&1 | tee ci-logs/create.log
          bash tool/patch_android.sh 2>&1 | tee -a ci-logs/create.log

      - name: Get packages
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee ci-logs/pub.log

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings > ci-logs/analyze.log 2>&1 || true

      - name: Unit tests
        run: flutter test > ci-logs/test.log 2>&1 || true

      - name: Build release APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee ci-logs/build.log

      - name: Save logs to ci-logs branch
        if: always()
        run: |
          cd ci-logs
          git init -q -b ci-logs
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          echo "run ${{ github.run_number }} sha ${{ github.sha }} status ${{ job.status }}" > STATUS
          git add -A
          git commit -q -m "logs for run ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-logs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: creator-crm-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Creator CRM build ${{ github.run_number }}
          body: Release APK built from ${{ github.sha }}. Download app-release.apk and install on Android 6.0+.
          files: build/app/outputs/flutter-apk/app-release.apk
