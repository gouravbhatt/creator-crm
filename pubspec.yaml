publish_to: 'none'
version: 3.0.0+30

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite_sqlcipher: ^3.1.0
  path_provider: ^2.1.4
  path: ^1.9.0
  flutter_secure_storage: ^9.2.2
  cryptography: ^2.7.0
  image_picker: ^1.1.2
  url_launcher: ^6.3.0
  file_picker: ^8.1.2
  share_plus: ^10.0.2
  archive: ^3.6.1
  fl_chart: ^0.69.0
  intl: ^0.19.0
  pdf: ^3.11.1
  uuid: ^4.5.1
  http: ^1.2.2
  html: ^0.15.4
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
